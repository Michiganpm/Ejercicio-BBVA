<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicio BBVA Pokemon</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  .poke-img { width: 180px; height: 180px; object-fit: contain; }
  .tipo { text-transform: capitalize; }
</style>
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="mb-1">Ejercicio BBVA Pokemon</h1>
  <p class="text-muted">API: <code>https://pokeapi.co/api/v2/pokemon/{param}</code> donde param puede ser id o nombre. Aleatorio del 1 al 150.</p>

  <div class="card mb-4"><div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label for="nombre" class="form-label">Buscar por nombre</label>
        <input type="text" id="nombre" class="form-control" placeholder="Ejemplo pikachu, charizard, charmeleon">
      </div>
      <div class="col-md-3 d-grid">
        <button id="btn-nombre" class="btn btn-primary">Buscar por nombre</button>
      </div>
      <div class="col-md-4 d-grid">
        <button id="btn-aleatorio" class="btn btn-success">Aleatorio (id 1 al 150)</button>
      </div>
    </div>
    <div id="mensaje" class="alert alert-warning d-none mt-3 mb-0" role="alert"></div>
  </div></div>

  <div id="ficha" class="mb-4"></div>

  <!-- Modal de detalles -->
  <div class="modal fade" id="modal-detalle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modal-titulo">Detalles</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body" id="modal-cuerpo"></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button></div>
    </div></div>
  </div>

  <h2 class="h4">Mi equipo <small class="text-muted">(máximo 6 sin repetir)</small></h2>
  <p id="contador-equipo" class="text-muted">0 / 6 Pokemon</p>
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead><tr><th>#</th><th>Imagen</th><th>Nombre</th><th>Tipo</th><th>Altura</th><th>Peso</th><th></th></tr></thead>
      <tbody id="tabla-equipo"><tr><td colspan="7" class="text-muted">Aún no agregas Pokémon, busca uno y pulsa "Añadir a la tabla"</td></tr></tbody>
    </table>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
